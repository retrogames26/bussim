<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10251e"><title>Bus Driver — Road Trip</title>
<style>
:root{color-scheme:dark;--lime:#d6ff65;--glass:#101b19cc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bc7e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none;color:white}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:calc(12px + env(safe-area-inset-top)) 14px 0;gap:10px}.brand,.stat,.hint{background:var(--glass);border:1px solid #ffffff25;backdrop-filter:blur(8px);border-radius:15px;padding:10px 13px;box-shadow:0 8px 24px #0002}.brand{font-weight:900;letter-spacing:.08em;font-size:12px}.brand span{display:block;color:var(--lime);font-size:10px;letter-spacing:.2em;margin-top:2px}.stats{display:flex;gap:7px}.stat{text-align:center;min-width:67px;padding:8px 10px}.stat small{display:block;font-size:9px;letter-spacing:.14em;color:#b9cec5}.stat b{font-size:19px;font-variant-numeric:tabular-nums}.bottom{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;padding:0 15px;gap:12px}.steer{display:flex;gap:10px}.control{pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none;border:1px solid #ffffff40;background:#11251fdb;color:white;border-radius:20px;width:clamp(66px,18vw,92px);height:clamp(66px,18vw,92px);display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 8px 25px #001b1260;outline:none}.control:active,.control.active{background:#d6ff65;color:#17251b;transform:scale(.96)}.pedals{display:flex;gap:10px;align-items:flex-end}.pedals .control{width:clamp(74px,20vw,100px);height:clamp(82px,22vw,110px);font-size:13px;letter-spacing:.06em}.gas{background:#d6ff65;color:#17251b}.pedal-icon{font-size:24px;display:block;margin-bottom:4px}.hint{position:absolute;left:50%;top:25%;transform:translateX(-50%);font-size:12px;text-align:center;white-space:nowrap;color:#f1f6ee;transition:opacity .5s}.hint b{color:var(--lime)}.overlay{position:absolute;inset:0;background:linear-gradient(135deg,#071d17eF,#183e30d9);display:flex;align-items:center;justify-content:center;padding:22px;color:white}.panel{width:min(430px,100%);text-align:center;border:1px solid #ffffff2c;background:#0e211de8;padding:28px 22px;border-radius:26px;box-shadow:0 24px 80px #00150e70}.eyebrow{font-size:10px;letter-spacing:.25em;color:var(--lime);font-weight:800}.panel h1{font-size:clamp(32px,9vw,48px);line-height:.98;margin:12px 0}.panel p{color:#c3d4cb;line-height:1.6;font-size:14px}.start{border:0;background:var(--lime);color:#14241b;font-size:15px;font-weight:900;border-radius:14px;padding:16px 24px;width:100%;margin-top:10px}.tips{display:flex;justify-content:center;gap:14px;font-size:11px;color:#b7c8bf;margin-top:17px;flex-wrap:wrap}.hide{display:none!important}@media(min-width:800px){.bottom{padding:0 28px}.hint{top:18%}}
</style></head>
<body><canvas id="game"></canvas>
<div class="hud" id="hud"><div class="top"><div class="brand">ROADLINE<span>BUS SIMULATOR</span></div><div class="stats"><div class="stat"><small>SPEED</small><b><span id="speed">0</span><small style="display:inline;color:white"> km/h</small></b></div><div class="stat"><small>DISTANCE</small><b><span id="distance">0.0</span><small style="display:inline;color:white"> km</small></b></div></div></div><div class="hint" id="hint">HOLD <b>ACCELERATOR</b> TO DRIVE</div><div class="bottom"><div class="steer"><button class="control" id="left" aria-label="Steer left">←</button><button class="control" id="right" aria-label="Steer right">→</button></div><div class="pedals"><button class="control" id="brake"><span><span class="pedal-icon">▰</span>BRAKE</span></button><button class="control gas" id="gas"><span><span class="pedal-icon">▲</span>ACCEL</span></button></div></div></div>
<div class="overlay" id="intro"><div class="panel"><div class="eyebrow">YOUR ROUTE STARTS HERE</div><h1>BUS<br>DRIVER.</h1><p>Take the wheel, follow the road, and cruise through the countryside. Built for phone screens — steer with your thumbs and hold the accelerator to move.</p><button class="start" id="start">START DRIVING →</button><div class="tips"><span>← → STEER</span><span>▲ ACCELERATE</span><span>▰ BRAKE</span></div></div></div>
<script>
(()=>{const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,playing=false,speed=0,dist=0,steer=0,offset=0,curve=0,roadPos=0,last=0,shake=0;const keys={left:false,right:false,gas:false,brake:false};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function tree(x,y,s){ctx.fillStyle='#172b20';ctx.fillRect(x-s*.08,y-s*.05,s*.16,s*.55);poly([[x,y-s*1.5],[x-s*.48,y-s*.45],[x-s*.27,y-s*.5],[x-s*.6,y],[x+s*.6,y],[x+s*.27,y-s*.5],[x+s*.48,y-s*.45]],'#244d35');poly([[x,y-s*1.25],[x-s*.3,y-s*.55],[x+s*.3,y-s*.55]],'#39734b')}
function bus(x,y,scale){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.shadowColor='#07110d88';ctx.shadowBlur=12;ctx.shadowOffsetY=7;poly([[-37,-105],[29,-105],[39,-88],[43,-8],[34,0],[-36,0],[-43,-8],[-41,-87]],'#d7e3d8');ctx.shadowBlur=0;poly([[-34,-99],[25,-99],[32,-85],[-33,-85]],'#23483f');for(let i=0;i<4;i++){let yy=-75+i*16;poly([[-32,yy],[31,yy],[32,yy+13],[-32,yy+13]],i%2?'#c0d1c5':'#b2c8bc');line(-31,yy+13,31,yy+13,'#78988a',1)}poly([[-37,-9],[37,-9],[31,-2],[-33,-2]],'#334b43');poly([[-37,-12],[-29,-12],[-29,1],[-38,1]],'#141d19');poly([[29,-12],[37,-12],[38,1],[29,1]],'#141d19');poly([[-29,-12],[-19,-12],[-19,0],[-29,0]],'#141d19');poly([[19,-12],[29,-12],[29,0],[19,0]],'#141d19');poly([[-29,-8],[-20,-8],[-20,-4],[-29,-4]],'#f6f4d3');poly([[20,-8],[29,-8],[29,-4],[20,-4]],'#f6f4d3');ctx.restore()}
function draw(t){let dt=Math.min((t-last)/1000||0,.04);last=t;if(playing){if(keys.gas)speed+=34*dt;else speed-=5*dt;if(keys.brake)speed-=65*dt;speed=clamp(speed,0,112);steer=(keys.right?1:0)-(keys.left?1:0);offset+=steer*dt*(.45+speed/80);offset=clamp(offset,-1.3,1.3);dist+=speed*dt/3600;roadPos+=speed*dt*.9;curve=Math.sin(roadPos*.008)*.65+Math.sin(roadPos*.0027)*.45;document.querySelector('#speed').textContent=Math.round(speed);document.querySelector('#distance').textContent=dist.toFixed(1);if(speed>15)document.querySelector('#hint').style.opacity=0;else document.querySelector('#hint').style.opacity=1}
const horizon=h*.39;let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#76b7df');sky.addColorStop(1,'#e5dcb7');ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon);ctx.fillStyle='#f6e5a8';ctx.beginPath();ctx.arc(w*.78,h*.14,Math.min(w,h)*.055,0,Math.PI*2);ctx.fill();
poly([[0,horizon+5],[w*.12,horizon-18],[w*.23,horizon+3],[w*.38,horizon-28],[w*.52,horizon+2],[w*.67,horizon-24],[w*.83,horizon+2],[w,horizon-14],[w,h],[0,h]],'#738f76');poly([[0,horizon+40],[w*.18,horizon+6],[w*.31,horizon+29],[w*.5,horizon-4],[w*.73,horizon+30],[w*.89,horizon+1],[w,horizon+22],[w,h],[0,h]],'#507c5c');ctx.fillStyle='#68966a';ctx.fillRect(0,horizon,w,h-horizon);
const segments=120;let roadW0=w*.025,center0=w/2;function roadCenter(p){return w/2+Math.sin(p*.004)*w*.17+Math.sin(p*.0017)*w*.12-offset*w*.22}
let prevL=null,prevR=null,prevEL=null,prevER=null;for(let i=0;i<=segments;i++){let z=i/segments,y=horizon+Math.pow(z,1.8)*(h-horizon+50),pers=Math.pow(z,1.7),cx=roadCenter(roadPos+(1-z)*440),rw=(w*.025+pers*w*.43);let l=cx-rw,r=cx+rw;let stripe=Math.floor((roadPos*.09+(1-z)*38))%2===0;if(prevL){poly([[prevEL[0],prevEL[1]],[prevER[0],prevER[1]],[cx+rw*1.35,y],[cx-rw*1.35,y]],stripe?'#658b57':'#5c8350');poly([[prevL[0],prevL[1]],[prevR[0],prevR[1]],[r,y],[l,y]],stripe?'#b8b8a8':'#c8c7b5');let edgeW=Math.max(1,pers*8);poly([[prevL[0],prevL[1]],[prevL[0]+edgeW,prevL[1]],[l+edgeW,y],[l,y]],stripe?'#e8e6d3':'#b84c3e');poly([[prevR[0]-edgeW,prevR[1]],[prevR[0],prevR[1]],[r,y],[r-edgeW,y]],stripe?'#e8e6d3':'#b84c3e');if(Math.floor((roadPos*.08+(1-z)*30))%2===0){let mw=Math.max(1,pers*3);poly([[cx-mw, y-(h-horizon)*.02*pers],[cx+mw,y-(h-horizon)*.02*pers],[cx+mw*1.2,y],[cx-mw*1.2,y]],'#f2e9c7')}}prevL=[l,y];prevR=[r,y];prevEL=[cx-rw*1.35,y];prevER=[cx+rw*1.35,y]}
for(let i=0;i<22;i++){let z=((i/22+(roadPos*.00045)%1)%1),y=horizon+Math.pow(z,1.7)*(h-horizon),side=i%2?1:-1,x=roadCenter(roadPos+(1-z)*500)+side*(w*.05+Math.pow(z,1.7)*w*.58);if(y<h-60)tree(x,y,Math.max(5,z*45))}
const busScale=Math.min(w/390, h/650)*1.05;bus(w/2+offset*w*.11,h*.91,busScale);if(playing&&speed>20){ctx.fillStyle='#ffffff18';for(let i=0;i<12;i++){let x=(i*97+roadPos*14)%w;line(x,h*.55,x-8,h*.7,'#ffffff30',1)}}requestAnimationFrame(draw)}
function bind(id,key){let el=document.getElementById(id);const down=e=>{e.preventDefault();keys[key]=true;el.classList.add('active');try{el.setPointerCapture(e.pointerId)}catch{}};const up=e=>{e.preventDefault();keys[key]=false;el.classList.remove('active')};el.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,up))}
bind('left','left');bind('right','right');bind('gas','gas');bind('brake','brake');document.querySelector('#start').addEventListener('click',()=>{playing=true;document.querySelector('#intro').classList.add('hide');last=performance.now()});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w')keys.gas=true;if(e.key==='ArrowDown'||e.key==='s'||e.code==='Space')keys.brake=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w')keys.gas=false;if(e.key==='ArrowDown'||e.key==='s'||e.code==='Space')keys.brake=false});document.addEventListener('visibilitychange',()=>{if(document.hidden)Object.keys(keys).forEach(k=>keys[k]=false)});requestAnimationFrame(draw)})();
</script></body></html>
